replicaCount: 1

image:
  repository: quay.io/ucsc_cgl/toil
  tag: "9.4.1-c6a39f2c827899f9a1dd0018ca2b72c675120096-py3.13"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

awsRegion: us-east-1

s3:
  endpointUrl: http://s3-service.zoo.svc.cluster.local:9000
  host: s3-service.zoo.svc.cluster.local
  port: "9000"
  useSsl: false
  addressingStyle: path
  credentials:
    existingSecret: s3-service
    accessKeyKey: rootUser
    secretKeyKey: rootPassword
    createSecret: false
    accessKeyValue: "minio-admin"
    secretKeyValue: "minio-secret-password"

# Optional additional env vars injected into the Toil WES pod.
env: {}

resources: {}

# Pod-level security context.
# On clusters where user namespaces are restricted (user.max_user_namespaces=0
# or seccomp/AppArmor policies blocking clone()), Singularity cannot extract
# SIF images and fails with "Operation not permitted".
# Setting podSecurityContext.sysctls is the cleanest fix when the cluster
# allows unsafe sysctls on pods (requires kubelet --allowed-unsafe-sysctls).
# Alternatively, set securityContext.privileged=true on the container (less secure).
podSecurityContext: {}
# podSecurityContext:
#   sysctls:
#     - name: user.max_user_namespaces
#       value: "15000"

# Container-level security context.
securityContext: {}
# securityContext:
#   privileged: true  # allows Singularity to create user namespaces

nodeSelector: {}
affinity: {}
tolerations: []
